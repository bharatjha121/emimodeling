<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Calculator - Calculate Your Loan EMI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>EMI Calculator</h1>
        </header>

        <div class="main-wrapper">
            <div class="calculator-section">
                <div class="input-group">
                    <label for="loanAmount">Loan Amount</label>
                    <div class="input-with-slider">
                        <input type="number" id="loanAmount" placeholder="Enter loan amount" min="0" step="1000"
                            value="5000000">
                        <input type="range" id="loanAmountSlider" min="0" max="10000000" step="10000" value="5000000">
                    </div>
                </div>

                <div class="input-group">
                    <label for="interestRate">Interest Rate (% per annum)</label>
                    <div class="input-with-slider">
                        <input type="number" id="interestRate" placeholder="Enter interest rate" min="1" max="30"
                            step="0.1" value="10">
                        <input type="range" id="interestRateSlider" min="1" max="30" step="0.1" value="10">
                    </div>
                </div>

                <div class="input-group">
                    <label for="loanTenure">Loan Tenure</label>
                    <div class="tenure-wrapper">
                        <input type="number" id="loanTenure" placeholder="Enter tenure" min="1" max="30" value="5">
                        <select id="tenureType">
                            <option value="years">Years</option>
                            <option value="months">Months</option>
                        </select>
                    </div>
                    <input type="range" id="loanTenureSlider" min="1" max="30" step="1" value="5" class="tenure-slider">
                </div>
            </div>

            <div class="part-payment-section">
                <div class="section-header">
                    <h2>Part Payments / Prepayments</h2>
                    <button type="button" id="addPartPayment" class="add-btn">+ Add Payment</button>
                </div>
                <div class="additional-monthly-payment">
                    <label for="additionalMonthlyPayment">Additional Monthly Payment (₹)</label>
                    <input type="number" id="additionalMonthlyPayment" placeholder="Enter additional monthly amount"
                        min="0" step="1000" value="0">
                </div>
                <div id="partPaymentsList" class="part-payments-list">
                    <!-- Part payment entries will be added here -->
                </div>
                <div id="savingsMessage" class="savings-message" style="display: none;">
                    <!-- Savings message will be displayed here -->
                </div>
            </div>

            <div class="results-section">
                <div class="emi-display">
                    <div class="emi-label">Your EMI</div>
                    <div class="emi-value" id="emiAmount">₹21,247</div>
                </div>

                <div class="results-grid">
                    <div class="result-item">
                        <span class="result-label">Total Interest Payable</span>
                        <span class="result-value" id="totalInterest">₹0</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Total Amount</span>
                        <span class="result-value" id="totalAmount">₹0</span>
                        <span class="result-subtext">(Principal + Interest)</span>
                    </div>
                </div>

                <div class="chart-container" id="chartContainer">
                    <canvas id="pieChart"></canvas>
                    <div class="chart-legend" id="chartLegend"></div>
                </div>
            </div>
        </div>

        <div class="schedule-section" id="scheduleSection">
            <div class="schedule-header">
                <h2>Amortization Schedule</h2>
                <button id="toggleSchedule" class="toggle-btn">Show Full Schedule</button>
            </div>


            <div id="scheduleTable" class="schedule-table-wrapper" style="display: none;">
                <table id="amortizationTable">
                    <thead>
                        <tr>
                            <th>Month & Year</th>
                            <th>Principal (₹)</th>
                            <th>Interest (₹)</th>
                            <th>Total Payment (₹)</th>
                            <th>Balance (₹)</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
